services:
  postgres:
    image: postgres:16-alpine
    container_name: grindstats-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-grindstats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grindstats}
      POSTGRES_DB: ${POSTGRES_DB:-grindstats}
    ports:
      # 5433 by default: a locally installed Postgres commonly owns 5432 and
      # would silently shadow this container for anything dialing localhost.
      - "${POSTGRES_PORT:-5433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER:-grindstats} -d $${POSTGRES_DB:-grindstats}"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: grindstats-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  server:
    build:
      context: .
      dockerfile: services/monolith/Dockerfile
    container_name: grindstats-server
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    ports:
      - "${SERVER_PORT:-8080}:8080"
    environment:
      # Postgres
      POSTGRES_HOST: postgres
      POSTGRES_PORT: 5432
      POSTGRES_USER: ${POSTGRES_USER:-grindstats}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-grindstats}
      POSTGRES_DB: ${POSTGRES_DB:-grindstats}
      POSTGRES_SSLMODE: ${POSTGRES_SSLMODE:-disable}
      # Redis
      REDIS_HOST: redis
      REDIS_PORT: 6379
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: ${REDIS_DB:-0}
      # HTTP
      SERVER_PORT: 8080
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-http://localhost:5173}
      # Auth — JWT key material (mount .local/jwt into the container)
      AUTH_JWT_PRIVATE_KEY_PATH: ${AUTH_JWT_PRIVATE_KEY_PATH:-/run/secrets/jwt/signing.key}
      AUTH_JWT_PUBLIC_KEYS_DIR: ${AUTH_JWT_PUBLIC_KEYS_DIR:-/run/secrets/jwt/public}
      # Cookie security: false for plain-http local dev (SEC-06)
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-false}
      # HIBP: disable in local dev to avoid live network calls
      AUTH_HIBP_ENABLED: ${AUTH_HIBP_ENABLED:-false}
      # Google OAuth2 credentials — fill in a .env file; never commit real values
      AUTH_GOOGLE_CLIENT_ID: ${AUTH_GOOGLE_CLIENT_ID:-}
      AUTH_GOOGLE_CLIENT_SECRET: ${AUTH_GOOGLE_CLIENT_SECRET:-}
      AUTH_GOOGLE_REDIRECT_URL: ${AUTH_GOOGLE_REDIRECT_URL:-http://localhost:8080/api/v1/auth/oauth/google/callback}
      AUTH_GOOGLE_STATE_KEY: ${AUTH_GOOGLE_STATE_KEY:-}
      # Mailer: dev mode logs links to stdout
      AUTH_MAILER_MODE: ${AUTH_MAILER_MODE:-dev}
      AUTH_BASE_URL: ${AUTH_BASE_URL:-http://localhost:5173}
    volumes:
      # Mount the git-ignored local key directory so the server can load JWT keys.
      # Generate with: bash scripts/dev/gen-jwt-keys.sh
      - ./.local/jwt:/run/secrets/jwt:ro

volumes:
  postgres_data:
  redis_data:
